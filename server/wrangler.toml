name = "pocket-hotel-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "pocket-hotel"
database_id = "4dca9457-b87e-4164-acc1-f5b505340d07"
migrations_dir = "migrations"

[vars]
ALLOWED_ORIGINS = "https://pocket-hotel.dahal-khani.workers.dev"
MAIL_FROM = "Pocket Hotel <onboarding@resend.dev>"
# Local testing only: return the OTP in the response. Never set to 1 in production.
DEV_RETURN_OTP = "0"
ADMIN_EMAIL = ""

# Secrets (wrangler secret put NAME, or .dev.vars for local): JWT_SECRET, ADMIN_KEY, RESEND_API_KEY,
# GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET, GMAIL_REFRESH_TOKEN, GMAIL_SENDER

[triggers]
crons = ["17 3 * * *"]
